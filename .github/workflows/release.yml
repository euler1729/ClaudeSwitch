name: Release

# Push a tag like v0.2.1 (matching package.json) to build, test and publish a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # No install scripts: nothing from npm runs with this job's write access.
      - run: npm ci --ignore-scripts

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}"
            exit 1
          fi

      - run: npm test

      - name: Package the extension
        run: |
          npm run package
          sha256sum claudeswitch-*.vsix > SHA256SUMS.txt

      - name: Write release notes
        run: node .github/scripts/release-notes.js "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" claudeswitch-*.vsix SHA256SUMS.txt \
            --title "ClaudeSwitch ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
